---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    storage:
      hosts:
        storage-server:
          ansible_host: 192.168.1.10   # TO ADAPT: real IP of the storage server (never 127.0.0.1)
          ansible_user: admin          # TO ADAPT: administration account (member of sudo)
