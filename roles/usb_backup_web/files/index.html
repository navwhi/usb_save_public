<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USB key backups</title>
<style>
  :root {
    --ink: #1d2a33; --paper: #eef2f1; --card: #ffffff;
    --line: #c9d4d2; --accent: #2f6f73; --muted: #5b6b72;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e3ecea; --paper: #142025; --card: #1b2a30; --line: #2e434a; --accent: #7fc4c6; --muted: #9fb1b5; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--paper); color: var(--ink);
    font: 17px/1.5 "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    padding: 1.5rem;
  }
  main {
    width: 100%; max-width: 26rem; background: var(--card);
    border: 1px solid var(--line); border-left: 6px solid var(--accent);
    border-radius: 4px; padding: 2rem 1.75rem;
  }
  h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  label { display: block; font-weight: 600; margin-bottom: .35rem; }
  input {
    width: 100%; font: inherit; padding: .6rem .7rem; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 3px;
  }
  button {
    margin-top: 1rem; width: 100%; font: inherit; font-weight: 600;
    padding: .65rem; border: 0; border-radius: 3px;
    background: var(--accent); color: var(--card); cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .err { color: #b3261e; min-height: 1.5em; margin: .5rem 0 0; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>USB key backups</h1>
  <p>Enter the name of your team. You will then be asked for the team password.</p>
  <form id="f" novalidate>
    <label for="team">Team</label>
    <input id="team" name="team" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <button type="submit">Open backups</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = document.getElementById('team').value.trim().toLowerCase();
    if (!/^[a-z][a-z0-9_-]{1,31}$/.test(t)) {
      document.getElementById('err').textContent = "Invalid team name: lowercase letters, digits, - or _.";
      return;
    }
    window.location.href = '/' + encodeURIComponent(t) + '/';
  });
  document.getElementById('team').addEventListener('input', function () {
    document.getElementById('err').textContent = '';
  });
</script>
</body>
</html>
