[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
# Vault password: asked at each run by default (--ask-vault-pass).
# To stop typing it, uncomment the next line and create the file OUTSIDE
# the repository, readable by you only (chmod 600):
# vault_password_file = ~/.config/usb-backup/vault_pass

[ssh_connection]
pipelining = True
